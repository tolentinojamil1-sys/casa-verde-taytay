<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa Verde | Admin</title><style>body{font:16px system-ui,sans-serif;max-width:1000px;margin:0 auto;padding:20px;color:#143f2e;background:#f5f7f4}section{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:15px 0}input,button,select{font:inherit;padding:10px;margin:5px;border:1px solid #abc;border-radius:7px;max-width:100%}button{background:#115438;color:white}article{border-top:1px solid #ddd;padding:12px 0}small{color:#637}.hidden{display:none}.err{color:#a22}.ok{color:#174}h1{margin-bottom:4px}</style></head><body><h1>Casa Verde Admin</h1><p><a href="index.html">← Booking website</a></p><section id="login"><h2>Admin login</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button></form></section><main id="dashboard" class="hidden"><button id="logout">Sign out</button><section><h2>Booking records</h2><button id="refresh">Refresh</button><div id="bookings"></div></section><section><h2>Block dates</h2><form id="blockForm"><label>From<input type="date" id="from" required></label><label>Until (checkout/exclusive)<input type="date" id="to" required></label><input id="reason" maxlength="200" placeholder="Reason"><button>Block dates</button></form><div id="blocks"></div></section></main><p id="status" role="status"></p><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
