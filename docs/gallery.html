<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Gallery | Casa Verde Taytay</title><meta name="description" content="Explore Casa Verde Taytay pool, lounge and accommodation photos."><style>*{box-sizing:border-box}body{margin:0;background:#fafbf8;color:#183b30;font-family:system-ui,sans-serif}header{padding:20px 6%;background:white;border-bottom:1px solid #dce6df;display:flex;justify-content:space-between}a{color:#217456;font-weight:700;text-decoration:none}main{max-width:1200px;margin:auto;padding:35px 20px 80px}h1{font-family:Georgia,serif;font-size:clamp(36px,5vw,58px);font-weight:500}p{color:#5c7368}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.photo{position:relative;aspect-ratio:3/4;padding:0;border:0;border-radius:15px;overflow:hidden;background:#e7eee9;cursor:zoom-in}.photo[hidden]{display:none}.photo img{width:100%;height:100%;object-fit:cover}.photo span{position:absolute;bottom:0;left:0;right:0;color:white;text-align:left;font-weight:700;padding:25px 15px 15px;background:linear-gradient(transparent,#000a)}dialog{border:0;border-radius:16px;background:#0c1713;color:white;max-width:95vw;padding:12px}dialog::backdrop{background:#000d}dialog img{display:block;max-height:80vh;max-width:90vw;object-fit:contain}dialog button{padding:8px 16px;cursor:pointer}.controls{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:5px 0 10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}}</style></head><body><header><a href="index.html">CASA VERDE TAYTAY</a><a href="index.html">Back to home</a></header><main><h1>Explore Casa Verde</h1><p>See our private pool, indoor spaces and gathering areas. Tap any photo to enlarge it.</p><div class="grid"><button class="photo" aria-label="View Poolside Bamboo Retreat" onclick="showPhoto('pool-bamboo','Poolside Bamboo Retreat')"><img src="images/pool-bamboo.webp" alt="Poolside Bamboo Retreat" loading="lazy" onerror="this.closest('button').hidden=true"><span>Poolside Bamboo Retreat</span></button><button class="photo" aria-label="View Casa Verde Entrance" onclick="showPhoto('entrance','Casa Verde Entrance')"><img src="images/entrance.webp" alt="Casa Verde Entrance" loading="lazy" onerror="this.closest('button').hidden=true"><span>Casa Verde Entrance</span></button><button class="photo" aria-label="View Private Pool and Dining" onclick="showPhoto('pool-dining','Private Pool and Dining')"><img src="images/pool-dining.webp" alt="Private Pool and Dining" loading="lazy" onerror="this.closest('button').hidden=true"><span>Private Pool and Dining</span></button><button class="photo" aria-label="View Cozy Living Area" onclick="showPhoto('living-area','Cozy Living Area')"><img src="images/living-area.webp" alt="Cozy Living Area" loading="lazy" onerror="this.closest('button').hidden=true"><span>Cozy Living Area</span></button><button class="photo" aria-label="View Open-Air Lounge" onclick="showPhoto('open-air-lounge','Open-Air Lounge')"><img src="images/open-air-lounge.webp" alt="Open-Air Lounge" loading="lazy" onerror="this.closest('button').hidden=true"><span>Open-Air Lounge</span></button><button class="photo" aria-label="View Vintage-Inspired Interior" onclick="showPhoto('interior-entry','Vintage-Inspired Interior')"><img src="images/interior-entry.webp" alt="Vintage-Inspired Interior" loading="lazy" onerror="this.closest('button').hidden=true"><span>Vintage-Inspired Interior</span></button><button class="photo" aria-label="View Dining and Gathering Space" onclick="showPhoto('dining-room','Dining and Gathering Space')"><img src="images/dining-room.webp" alt="Dining and Gathering Space" loading="lazy" onerror="this.closest('button').hidden=true"><span>Dining and Gathering Space</span></button><button class="photo" aria-label="View Spacious Sleeping Area" onclick="showPhoto('sleeping-area','Spacious Sleeping Area')"><img src="images/sleeping-area.webp" alt="Spacious Sleeping Area" loading="lazy" onerror="this.closest('button').hidden=true"><span>Spacious Sleeping Area</span></button><button class="photo" aria-label="View Air-Conditioned Beds" onclick="showPhoto('bedroom','Air-Conditioned Beds')"><img src="images/bedroom.webp" alt="Air-Conditioned Beds" loading="lazy" onerror="this.closest('button').hidden=true"><span>Air-Conditioned Beds</span></button><button class="photo" aria-label="View Private Pool Overview" onclick="showPhoto('pool-overview','Private Pool Overview')"><img src="images/pool-overview.webp" alt="Private Pool Overview" loading="lazy" onerror="this.closest('button').hidden=true"><span>Private Pool Overview</span></button></div></main><dialog id="viewer"><div class="controls"><strong id="caption"></strong><button onclick="document.getElementById('viewer').close()">Close ✕</button></div><img id="full" alt=""></dialog><script>function showPhoto(file,caption){const image=document.getElementById('full');image.src='images/'+file+'.webp';image.alt=caption;document.getElementById('caption').textContent=caption;document.getElementById('viewer').showModal()}</script></body></html>
