<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'">
  <title>Casa Verde Admin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section class="section" style="max-width:950px;margin:auto">
    <h2>Casa Verde Admin</h2>
    <div id="login">
      <p>Sign in to manage reservations.</p>
      <form id="login-form">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <p id="msg" role="status"></p>
    </div>
    <div id="panel" hidden>
      <p><a class="btn" href="https://tolentinojamil1-sys.github.io/casa-verde-taytay/">Website</a> <button class="btn" id="logout" type="button">Log out</button></p>
      <h3>Reservations</h3>
      <div id="table" style="overflow-x:auto"></div>
      <h3>Block a date</h3>
      <form id="block-form">
        <label>Date<input id="date" type="date" required></label>
        <label>Reason<input id="reason" maxlength="160" placeholder="Reason"></label>
        <button class="btn" type="submit">Block date</button>
      </form>
      <h3>Settings</h3>
      <form id="settings-form">
        <label>Nightly rate<input id="rate" type="number" min="1" required></label>
        <label>Max guests<input id="max" type="number" min="1" max="50" required></label>
        <button class="btn" type="submit">Save settings</button>
      </form>
      <p id="panel-msg" role="status"></p>
    </div>
  </section>
  <script src="/admin.js"></script>
</body>
</html>
